defaults: !include ../../default.yaml

overrides:
    # SAIL* (concat cls+patch) token-level, d_align=512. Vision-axis generality:
    # swap DINOv2 ViT-L -> MAE ViT-L/16 (patch16, different-SSL), keep
    # RoBERTa-large — the baseline sibling of
    # configs/pal/maevitl_roberta/token_k512.yaml. No (23,24) pin (DINOv2-specific)
    # -> mutual-kNN layer selection (on all-layer pooled caches) picks the pair,
    # then token training runs on that layer. RoBERTa text cache reused; MAE new.
    alignment:
        llm_model_name: "sentence-transformers/all-roberta-large-v1"
        lvm_model_name: "vit_large_patch16_224.mae"

    features:
        dataset: "coco"
        batch_size: 64
        num_workers: 0
        # Pin the pair PAL's mutual-kNN selected on MAE: (img=19, txt=24).
        # Required for token runs: pinning skips the all-layer pooled extraction
        # so the trainer doesn't hold ~57 GB cls caches while mmapping the 146 GB
        # text token cache (OOMs under this box's 130 GB CommitLimit otherwise).
        layer_img: 19
        layer_txt: 24

    layer_selection:
        best_only: true
        last_only: false

    training:
        token_level: true

        alignment_layer_name: "SAILAlignmentLayer"
        alignment_layer_kwargs:
            dim_alignment: 512
            width_factor: 8
            concat_cls_patch: true

        batch_size: 4096

        clip_loss_name: "CLIPLoss"
        clip_loss:
            temperature: 0.05
            normalize_latents: true
            warmup_steps: 1000
            structure_lambda: 0
            structure_levels: 1
            structure_margin: 0.0
            structure_weighting: "none"

    evaluation:
        token_level_zero_shot: true
        zero_shot_datasets:
            - "stl10"
            - "cifar100"
            - "caltech101"
            - "dtd"
            - "eurosat"
        retrieval_datasets:
            - "flickr30"
            - "coco_karpathy"
