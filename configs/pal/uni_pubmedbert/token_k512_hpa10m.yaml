defaults: !include ../../default.yaml

# HPA10M IHC PAL -- BRING-UP config (UNI v1 + PubMedBERT, token K=512).
# Validates the full HPA data pipeline (extract -> feature -> PAL -> val retrieval) with the
# already-integrated UNI v1 encoder BEFORE swapping to UNI2-h (which adds reg-token slicing +
# SwiGLU/fx handling). Same recipe as token_k512_pathcap.yaml; only the dataset/selection differ.
# HPA captions are short templated strings (<128 BERT tokens) so no truncation/le128 needed.
# Images: whole-core resized to 256 (option C, scripts/prepare_hpa10m.py --mode whole); the
# encoder transform resizes to 224. Switch to native-crop later by re-running prepare with
# --mode crop and repointing data/hpa10m/images + the selection_path below.
overrides:
    alignment:
        llm_model_name: "microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext"
        lvm_model_name: "hf-hub:MahmoodLab/UNI"

    features:
        dataset: "hpa10m"
        selection_path:
            train: "/home/shiwon/STRUCTURE/data/hpa10m/selections/hpa10m_train_whole256_seed42.csv"
            val: "/home/shiwon/STRUCTURE/data/hpa10m/selections/hpa10m_val_whole256_seed42.csv"
        batch_size: 64
        num_workers: 0
        layer_img: 23    # UNI ViT-L last block (0..23)
        layer_txt: 12    # PubMedBERT-base last hidden (0..12)

    layer_selection:
        best_only: true
        last_only: false

    training:
        token_level: true

        alignment_layer_name: "PALAlignmentLayer"
        alignment_layer_kwargs:
            num_anchors: 512
            pool_temperature: 0.05
            projector_dim: 0

        batch_size: 4096

        clip_loss_name: "CLIPLoss"
        clip_loss:
            temperature: 0.05
            normalize_latents: true
            warmup_steps: 1000
            structure_lambda: 0
            structure_levels: 1
            structure_margin: 0.0
            structure_weighting: "none"

        visualize_original_embeddings: false
        log_structural_preservation: false

    evaluation:
        token_level_zero_shot: true
        # No HPA-native zero-shot benchmark yet (pathologist to design). Use in-domain
        # image-text retrieval on the 2,000-pair HPA val set as the bring-up proxy.
        zero_shot_datasets: []
        retrieval_datasets:
            - "hpa10m"
