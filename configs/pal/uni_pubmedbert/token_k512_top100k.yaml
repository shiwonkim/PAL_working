defaults: !include ../../default.yaml

# Pathology PAL — CONCH-quality top-100K selection (whole Quilt-1M train scored
# by CONCH, top-100K by score >= 0.535 ~ p90). Tests whether quality curation
# scales better than metadata-only (full) at ~100K. Same UNI+PubMedBERT token
# K=512 recipe as token_k512_full.yaml; only the train selection differs.
overrides:
    alignment:
        llm_model_name: "microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext"
        lvm_model_name: "hf-hub:MahmoodLab/UNI"

    features:
        dataset: "quilt1m"
        selection_path:
            # top-100K CONCH-quality pairs, then dropped the 1,899 captions
            # > 128 BERT tokens (98.3% pubmed abstracts) so NO truncation is
            # needed — the pool is natively <=128 tokens (width matches the
            # other Quilt curves). 98,101 pairs.
            train: "/home/shiwon/STRUCTURE/data/quilt1m/selections/quilt_openpath-quilt_train_conchtop100k_le128_seed42.csv"
            val: "/home/shiwon/STRUCTURE/data/quilt1m/selections/quilt_openpath-quilt_val_full_seed42.csv"
        batch_size: 64
        num_workers: 0
        layer_img: 23    # UNI ViT-L last block (0..23)
        layer_txt: 12    # PubMedBERT-base last hidden (0..12)

    layer_selection:
        best_only: true
        last_only: false

    training:
        token_level: true

        alignment_layer_name: "PALAlignmentLayer"
        alignment_layer_kwargs:
            num_anchors: 512
            pool_temperature: 0.05
            projector_dim: 0

        batch_size: 4096

        clip_loss_name: "CLIPLoss"
        clip_loss:
            temperature: 0.05
            normalize_latents: true
            warmup_steps: 1000
            structure_lambda: 0
            structure_levels: 1
            structure_margin: 0.0
            structure_weighting: "none"

        visualize_original_embeddings: false
        log_structural_preservation: false

    evaluation:
        token_level_zero_shot: true
        zero_shot_datasets:
            - "crc100k"
            - "pcam"
        retrieval_datasets: []
